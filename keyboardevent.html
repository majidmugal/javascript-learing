<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input type="text" class="inp">
    <div class="heading"></div>



    <script>
        document.querySelector(".inp").addEventListener("keydown", (event)=>{
            document.querySelector(".heading").innerHTML=event.key
         })

         document.querySelector(".inp").addEventListener("keyup", (event)=>{
            document.querySelector(".heading").innerHTML=event.key
         })

           document.querySelector(".inp").addEventListener("keypress" , (event)=>{

            document.querySelector(".heading").innerHTML=event.key
           })


        document.querySelector(".inp").addEventListener("input", (event)=>{
            document.querySelector(".heading").innerHTML=event.target.value
         })

         document.querySelector(".inp").addEventListener("change", (event)=>{
            document.querySelector(".heading").innerHTML=event.target.value
         })


    </script>
</body>
</html>
