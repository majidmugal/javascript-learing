<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            margin: auto;
            border-radius: 50%;
            width: 300px;
            height: 300px;
            background-image: repeating-conic-gradient(red,blue,green,yellow 10%);
            animation-name: circle;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes circle {
            0%{
                transform: rotate(360deg);
            }
            100%{
                transform: rotate(720deg);
            }
        }
        .btn{
            padding: 10px 20px;
            background-color: orangered;
            border: none;
            border-radius: 3px;
            color: white;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;

        }
    
    

    </style>
</head>

<body>
    <div class="main"></div>
   <center>
        <button class="btn" onclick="toggleSpin()">stop</button>
   <script src="circleproject.js"></script>
</body>

</html>
