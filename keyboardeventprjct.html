<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" class="num1" placeholder="input first number">
    <input type="number" class="num2" placeholder="input second number">

    <button class="add">+</button>
    <button class="sub">-</button>
    <button class="mul">*</button>
    <button class="module">%</button>
    <button class="div">/</button>

    <div class="result"></div>
</body>

<script>

    let num1 = document.querySelector(".num1")
    let num2 = document.querySelector(".num2")
    let result = document.querySelector(".result")


    document.querySelector(".add").addEventListener("click",()=>{
        

    result.innerHTML = Number(num1.value) + Number(num2.value)
})

    document.querySelector(".sub").addEventListener("click",()=>{

    result.innerHTML = Number(num1.value) - Number(num2.value)
})


document.querySelector(".mul").addEventListener("click",()=>{

    result.innerHTML = Number(num1.value) * Number(num2.value)
})


document.querySelector(".module").addEventListener("click",()=>{

    result.innerHTML = Number(num1.value) % Number(num2.value)
})



document.querySelector(".div").addEventListener("click",()=>{

    result.innerHTML = Number(num1.value) / Number(num2.value)
})
    

</script>



</html>
